[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -q --strict-markers
markers =
    unit: Fast unit tests without external network or file dependencies
    integration: Integration tests between modules
    schemas: Schema validation tests
    llm: Tests exercising LLM provider fallback routing
